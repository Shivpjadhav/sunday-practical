    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: 'Courier New', monospace;

        #matrix-canvas {
            position: fixed;

<body>
    <div id="name-overlay">
        <div class="glitch-text" id="glitch-name">SHIVANI JADHAV</div>
    </div>
    <!-- <div class="system-tag">> BURST // SCAN // HACKER DHANYAWAD</div> -->
    <div class="scanline" id="final-scan"></div>
    <div class="scan-flash" id="scan-flash"></div>
    <canvas id="matrix-canvas"></canvas>
    <div id="three-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- RESUME LINES (hacker-style) ---
        const RESUME_LINES = [
            "> INITIALIZING SHIVANI JADHAV RESUME ...",
            "> ================================",
            "> NAME:       SHIVANI JADHAV",
            "> ROLE:       FULL-STACK HACKER / CYPHERPUNK",
            "> SKILLS:     REACT // NODE // PYTHON // C++",
            "> EXPERIENCE: 5+ YEARS @ TECHCRIME INC",
            "> PROJECTS:   15+ COVERT OPS // PENETRATION TESTING",
            "> CONTACT:    SHIVANI.J@HACKMAIL // 0x1A3F",
            "> STATUS:     > // ACTIVE // <",
            "> ================================",
            "> ACCESS GRANTED // WELCOME TO THE GRID"
        ];

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = null;
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        document.getElementById('three-container').appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        labelRenderer.domElement.style.zIndex = '10';
        document.getElementById('three-container').appendChild(labelRenderer.domElement);

        // LIGHTS
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 3, 2);
        scene.add(dirLight);
        const greenLight = new THREE.PointLight(0x00ff00, 0.8, 10);
        greenLight.position.set(0, 2, 3);
        scene.add(greenLight);

        // FLOATING PARTICLES
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 800;
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            positions[i*3] = (Math.random() - 0.5) * 30;
            positions[i*3+1] = (Math.random() - 0.5) * 20;
            positions[i*3+2] = (Math.random() - 0.5) * 30 - 5;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x00ff00, size: 0.07, transparent: true, opacity: 0.3 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- THE BAG ---
        const bagGroup = new THREE.Group();
        const bodyMat = new THREE.MeshPhongMaterial({ color: 0x111111, emissive: 0x004400, shininess: 60, transparent: true, opacity: 0.9 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.4, 1.0), bodyMat);
        bagGroup.add(body);
        const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true, transparent: true, opacity: 0.4 });
        const wireBody = new THREE.Mesh(new THREE.BoxGeometry(2.25, 1.45, 1.05), wireframeMat);
        bagGroup.add(wireBody);
        const handleMat = new THREE.MeshStandardMaterial({ color: 0x33ff33, emissive: 0x113311 });
        const handle = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.08, 16, 32), handleMat);
        handle.rotation.x = Math.PI / 2;
        handle.rotation.z = Math.PI / 2;
        handle.position.set(0, 0.95, 0.2);
        handle.scale.set(0.9, 0.9, 0.9);
        bagGroup.add(handle);
        const latchMat = new THREE.MeshStandardMaterial({ color: 0x00aa00, emissive: 0x002200 });
        const latch1 = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8), latchMat);
        latch1.position.set(0.8, 0.4, 0.55);
        bagGroup.add(latch1);
        const latch2 = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8), latchMat);
        latch2.position.set(-0.8, 0.4, 0.55);
        bagGroup.add(latch2);
        const stripMat = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00aa00 });
        const strip = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.15), stripMat);
        strip.position.set(0, 0.0, 0.6);
        bagGroup.add(strip);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.03, 8, 20), latchMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.set(0, 0.2, 0.6);
        bagGroup.add(ring);
        bagGroup.scale.set(0.01, 0.01, 0.01);
        scene.add(bagGroup);

        // BLAST PARTICLES
        const blastParticlesGeo = new THREE.BufferGeometry();
        const blastCount = 400;
        const blastPositions = new Float32Array(blastCount * 3);
        const blastColors = new Float32Array(blastCount * 3);
        for (let i = 0; i < blastCount; i++) {
            blastPositions[i*3] = 0;
            blastPositions[i*3+1] = 0;
            blastPositions[i*3+2] = 0;
            blastColors[i*3] = 0.2 + Math.random()*0.8;
            blastColors[i*3+1] = 0.8 + Math.random()*0.5;
            blastColors[i*3+2] = 0.1;
        }
        blastParticlesGeo.setAttribute('position', new THREE.BufferAttribute(blastPositions, 3));
        blastParticlesGeo.setAttribute('color', new THREE.BufferAttribute(blastColors, 3));
        const blastMaterial = new THREE.PointsMaterial({ size: 0.3, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending });
        const blastParticles = new THREE.Points(blastParticlesGeo, blastMaterial);
        blastParticles.visible = false;
        scene.add(blastParticles);

        // --- MATRIX CANVAS ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+[];:'\",./<>?`~";
        const fontSize = 18;
        const columns = Math.floor(width / fontSize);
        const drops = new Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const char = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // --- references for later cleanup ---
        let perfectResumeObj = null;
        let hackerDhanyawadObj = null;

        // --- FUNCTION: SHOW HACKER DHANYAWAD (final) ---
        function showHackerDhanyawad() {
            // remove perfect resume if exists
            if (perfectResumeObj) {
                gsap.to(perfectResumeObj.scale, { x: 0, y: 0, z: 0, duration: 0.6, ease: "power2.in", onComplete: () => {
                    if (perfectResumeObj) scene.remove(perfectResumeObj);
                    perfectResumeObj = null;
                } });
            }

            // create hacker dhanyawad panel
            const hackerDiv = document.createElement('div');
            hackerDiv.className = 'hacker-dhanyawad';
            hackerDiv.innerHTML = `
                <h1>DHANYAWAD</h1>
                <img src="https://img.icons8.com/fluency/96/hacker.png" alt="hacker emblem" crossorigin="anonymous">
                <p>// thank you // shivani jadhav</p>
                <p style="font-size:1.0rem; color:#f0f;">> HACKER MODE <</p>
            `;
            const hackerObj = new CSS2DObject(hackerDiv);
            hackerObj.position.set(0, 0.5, 0);
            hackerObj.scale.set(0.01, 0.01, 0.01);
            scene.add(hackerObj);
            hackerDhanyawadObj = hackerObj;

            // animate in
            gsap.to(hackerObj.scale, { x: 1, y: 1, z: 1, duration: 1.4, ease: "elastic.out(1.2, 0.4)", delay: 0.1 });

            // subtle camera movement
            gsap.to(camera.position, { x: 0.2, z: 11.5, duration: 2, yoyo: true, repeat: 1, ease: "sine.inOut" });
        }

        // --- FUNCTION: SHOW PERFECT RESUME (clean card) ---
        function showPerfectResume() {
            const resumeDiv = document.createElement('div');
            resumeDiv.className = 'perfect-resume';
            resumeDiv.innerHTML = `
                <h1>SHIVANI JADHAV</h1>
                <div class="subhead">
                    <span>FULL-STACK</span> <span>CYBERSECURITY</span> <span>BLENDER</span>
                </div>
                <div class="resume-grid">
                    <div class="resume-col">
                        <p><i>>_</i> React / Node / Python</p>
                        <p><i>>_</i> C++ / Rust / Blender</p>
                        <p><i>>_</i> OSCP · CEH · AWS Sec</p>
                        <p><i>>_</i> 5+ yrs @ TechCrime Inc</p>
                    </div>
                    <div class="resume-col">
                        <p><i>>_</i> 15+ covert ops</p>
                        <p><i>>_</i> Penetration testing</p>
                        <p><i>>_</i> exploit development</p>
                        <p><i>>_</i> zero‑day research</p>
                    </div>
                </div>
                <div class="tagline">
                    >  PERFECT RESUME  <span class="blink"></span>
                </div>
                <p style="font-size:0.85rem; text-align:center; color:#6f6; margin-top:15px;">shivani.j@hackmail · 0x1A3F · #cypherpunk</p>
            `;
            const resumeObj = new CSS2DObject(resumeDiv);
            resumeObj.position.set(0, 0.5, 0);
            resumeObj.scale.set(0.01, 0.01, 0.01);
            scene.add(resumeObj);
            perfectResumeObj = resumeObj;

            gsap.to(resumeObj.scale, { x: 1, y: 1, z: 1, duration: 1.2, ease: "backOut(2)", delay: 0.2 });

            // After showing perfect resume, wait 4 seconds then show hacker dhanyawad
            gsap.delayedCall(4.0, () => {
                // start a final scan flash before hacker
                const scanline = document.getElementById('final-scan');
                const flash = document.getElementById('scan-flash');
                gsap.set(scanline, { top: '-10%', opacity: 1 });
                gsap.to(flash, { opacity: 0.4, duration: 0.2, yoyo: true, repeat: 2 });
                gsap.to(scanline, {
                    top: '110%',
                    duration: 1.5,
                    ease: "power2.inOut",
                    onComplete: () => {
                        gsap.set(scanline, { opacity: 0 });
                        gsap.set(flash, { opacity: 0 });
                        showHackerDhanyawad();
                    }
                });
            });
        }

        // --- SCAN ANIMATION (trigger perfect resume) ---
        function startScanAndShowPerfectResume() {
            const scanline = document.getElementById('final-scan');
            const flash = document.getElementById('scan-flash');
            
            // Hide terminal if still visible
            const terminalDiv = document.getElementById('hacker-terminal');
            if (terminalDiv) {
                gsap.to(terminalDiv, { opacity: 0, duration: 0.3, onComplete: () => {
                    terminalDiv.style.display = 'none';
                }});
            }

            // Prepare scanline
            gsap.set(scanline, { top: '-10%', opacity: 1 });
            gsap.set(flash, { opacity: 0 });

            // Flash and scan
            gsap.to(flash, { opacity: 0.3, duration: 0.1, yoyo: true, repeat: 1 });
            
            gsap.to(scanline, {
                top: '110%',
                duration: 1.8,
                ease: "power2.inOut",
                onComplete: () => {
                    gsap.set(scanline, { opacity: 0 });
                    gsap.set(flash, { opacity: 0 });
                    
                    // Show perfect resume
                    showPerfectResume();
                }
            });

            // Subtle shake
            gsap.to(camera.position, {
                x: 0.2, y: 1.5, z: 12,
                duration: 0.2,
                yoyo: true,
                repeat: 3,
                ease: "sine.inOut"
            });
        }

        // --- TERMINAL WITH TYPING ---
        function createTerminalWithTyping() {
            const terminalDiv = document.createElement('div');
            terminalDiv.className = 'terminal-panel';
            terminalDiv.id = 'hacker-terminal';
            terminalDiv.style.textAlign = 'left';
            terminalDiv.innerHTML = '';

            const terminalObj = new CSS2DObject(terminalDiv);
            terminalObj.position.set(0, 0.5, 0);
            terminalObj.scale.set(0.01, 0.01, 0.01);
            scene.add(terminalObj);

            gsap.to(terminalObj.scale, { x: 1, y: 1, z: 1, duration: 1.2, ease: "backOut(2)", delay: 0.2 });

            // Typewriter
            const fullText = RESUME_LINES.join('\n');
            let currentDisplay = '';
            const chars = fullText.split('');
            let charIndex = 0;

            function typeNextChar() {
                if (charIndex < chars.length) {
                    currentDisplay += chars[charIndex];
                    terminalDiv.innerHTML = currentDisplay + '<span class="cursor"></span>';
                    charIndex++;
                    setTimeout(typeNextChar, 40);
                } else {
                    // Typing finished: keep cursor, then trigger scan after pause
                    terminalDiv.innerHTML = currentDisplay + '<span class="cursor"></span>';
                    
                    setTimeout(() => {
                        startScanAndShowPerfectResume();
                    }, 1200);
                }
            }
            
            setTimeout(typeNextChar, 600);
        }

        // --- NAME OVERLAY SEQUENCE ---
        const nameOverlay = document.getElementById('name-overlay');
        setTimeout(() => {
            gsap.to(nameOverlay, { opacity: 0, duration: 1.5, ease: "power2.inOut", onComplete: () => {
                nameOverlay.style.display = 'none';
            } });

            // Grow bag
            gsap.to(bagGroup.scale, { x: 1, y: 1, z: 1, duration: 2.5, delay: 0.3, ease: "elastic.out(1, 0.5)",
                onUpdate: () => {
                    bagGroup.rotation.y += 0.01;
                    bagGroup.rotation.x += 0.002;
                }
            });

            // Bag burst and terminal
            gsap.delayedCall(4.0, () => {
                // Hide bag
                gsap.to(bagGroup.scale, { x: 0, y: 0, z: 0, duration: 0.4, ease: "power2.in" });
                
                // Activate blast particles
                blastParticles.position.copy(bagGroup.position);
                blastParticles.visible = true;
                
                const blastPos = blastParticles.geometry.attributes.position.array;
                for (let i = 0; i < blastCount; i++) {
                    const angle1 = Math.random() * Math.PI * 2;
                    const angle2 = Math.random() * Math.PI * 2;
                    const r = 2 + Math.random() * 5;
                    blastPos[i*3] = Math.sin(angle1) * Math.cos(angle2) * r;
                    blastPos[i*3+1] = Math.sin(angle2) * r;
                    blastPos[i*3+2] = Math.cos(angle1) * Math.cos(angle2) * r;
                }
                blastParticles.geometry.attributes.position.needsUpdate = true;
                
                gsap.to(blastParticles.material, { opacity: 0, duration: 1.5, delay: 0.3, onComplete: () => {
                    blastParticles.visible = false;
                    blastParticles.material.opacity = 1;
                }});

                // Create terminal (which will later trigger scan + perfect resume + hacker)
                createTerminalWithTyping();
            });
        }, 2800);

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.0003;
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        // RESIZE
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        // extra glitch effect
        setInterval(() => {
            if (nameOverlay.style.opacity !== '0') {
                const nameDiv = document.getElementById('glitch-name');
                nameDiv.style.transform = `skew(${Math.random()*6-3}deg, ${Math.random()*4-2}deg)`;
                setTimeout(() => nameDiv.style.transform = 'skew(0deg,0deg)', 100);
            }
        }, 300);
    </script>
</body>
</html>
